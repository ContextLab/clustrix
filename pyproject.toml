[build-system]
requires = ["setuptools>=64", "setuptools-scm>=6.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clustrix"
version = "0.1.1"
authors = [
    {name = "Contextual Dynamics Laboratory", email = "contextualdynamics@gmail.com"},
]
description = "Seamless distributed computing for Python functions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers", 
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9", 
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
keywords = ["distributed-computing", "cluster", "slurm", "kubernetes", "parallel"]
dependencies = [
    "paramiko>=2.7.0",
    "pyyaml>=5.4.0", 
    "cloudpickle>=2.0.0",
    "dill>=0.3.4",
    "click>=8.0.0",
    "requests>=2.25.0",
    "huggingface_hub>=0.16.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/ContextLab/clustrix"
Repository = "https://github.com/ContextLab/clustrix"
Documentation = "https://clustrix.readthedocs.io"
"Bug Tracker" = "https://github.com/ContextLab/clustrix/issues"

[project.scripts]
clustrix = "clustrix.cli:cli"

[project.optional-dependencies]
widget = [
    "ipywidgets>=7.6.0",
    "jupyter>=1.0", 
    "ipython>=7.0",
]
kubernetes = ["kubernetes>=20.13.0"]
aws = [
    "boto3>=1.26.0",
    "kubernetes>=20.13.0",
]
azure = [
    "azure-identity>=1.12.0",
    "azure-mgmt-containerservice>=20.0.0", 
    "kubernetes>=20.13.0",
]
gcp = [
    "google-cloud-container>=2.15.0",
    "google-cloud-resource-manager>=1.14.0",
    "google-auth>=2.15.0",
    "kubernetes>=20.13.0", 
]
cloud = [
    "boto3>=1.26.0",
    "azure-identity>=1.12.0",
    "azure-mgmt-containerservice>=20.0.0",
    "google-cloud-container>=2.15.0",
    "google-cloud-resource-manager>=1.14.0", 
    "google-auth>=2.15.0",
    "kubernetes>=20.13.0",
]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    # tests/comprehensive/* and several tests/*_real.py modules import numpy and
    # pandas at module scope to exercise array/dataframe serialization. Without
    # them those modules raise ModuleNotFoundError during collection (see #130).
    "numpy>=1.19",
    "pandas>=1.1",
    "black==25.1.0; python_version >= '3.9'",  # pinned - unbounded ">=" let CI pull 26.5.1 (see #110)
    "flake8>=3.8", 
    "mypy>=0.812",
    "types-PyYAML",
    "types-requests", 
    "types-paramiko",
]
test = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "coverage>=6.0",
    "pytest-xdist>=2.0",
    "pytest-mock>=3.0",
    "boto3>=1.26.0",
    "azure-identity>=1.12.0",
    "azure-mgmt-compute>=30.0.0",
    "azure-mgmt-containerservice>=20.0.0",
    "azure-mgmt-resource>=23.0.0",
    "azure-mgmt-network>=25.0.0", 
    "google-cloud-compute>=1.11.0",
    "google-cloud-container>=2.15.0",
    "google-cloud-resource-manager>=1.14.0",
    "google-auth>=2.15.0",
    "kubernetes>=20.13.0",
]
docs = [
    "sphinx>=4.0",
    "sphinx-wagtail-theme>=6.0.0",
    "sphinx-autodoc-typehints>=1.12",
    "nbsphinx>=0.8",
    "jupyter>=1.0",
    "ipython>=7.0",
]
all = [
    # Widget dependencies
    "ipywidgets>=7.6.0",
    "jupyter>=1.0",
    "ipython>=7.0",
    # Cloud provider dependencies
    "kubernetes>=20.13.0",
    "boto3>=1.26.0", 
    "azure-identity>=1.12.0",
    "azure-mgmt-containerservice>=20.0.0",
    "google-cloud-container>=2.15.0",
    "google-cloud-resource-manager>=1.14.0",
    "google-auth>=2.15.0",
    # Development dependencies
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black==25.1.0; python_version >= '3.9'",  # pinned - unbounded ">=" let CI pull 26.5.1 (see #110)
    "flake8>=3.8",
    "mypy>=0.812",
    # Documentation dependencies
    "sphinx>=4.0",
    "sphinx-wagtail-theme>=6.0.0", 
    "sphinx-autodoc-typehints>=1.12",
    "nbsphinx>=0.8",
]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["clustrix*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = "skip"
exclude = [
    "build/",
    "dist/",
    ".venv/",
    "venv/",
    ".git/",
    "__pycache__/",
    ".mypy_cache/",
    ".pytest_cache/",
    "tests/conftest.py",
    "tests/real_world/",
]
# Only check our package files  
files = ["clustrix/"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
# This is the project's ONLY pytest config. Do not add pytest.ini, tox.ini or
# setup.cfg: pytest selects the first config file it finds by precedence and
# then stops searching, so any of those would silently shadow this block --
# which is exactly what happened for months under #130. Enforced by
# tests/unit/test_pytest_config.py.
#
# testpaths must NOT list tests/integration. Those tests provision billable
# cloud resources and are gated by tests/integration/conftest.py (#109); naming
# the directory here would make a bare `pytest` resolve to it.
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*" 
python_functions = "test_*"
# --strict-markers makes an undeclared marker a collection error rather than a
# warning. Keep it: without it a typo'd marker silently does nothing and the
# test it decorates stops being selectable with no signal at all.
# Do NOT add "-n" here without first moving pytest-xdist from the [test] extra
# into [dev] -- otherwise `pip install -e ".[dev]"` yields an env where pytest
# cannot start (see #110).
addopts = "-v --tb=short --strict-markers"
# Every marker used anywhere under tests/ must appear here: --strict-markers
# turns an undeclared marker into a hard collection error. Verify with
#     grep -rhoE "@pytest\.mark\.[a-zA-Z_]+" tests/ | sort -u
# and note that tests/unit/test_pytest_config.py asserts these stay registered.
markers = [
    "real_world: marks tests as real world tests (deselect with '-m \"not real_world\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "expensive: marks tests that provision billable resources (applied automatically to tests/integration; see #109)",
    "dartmouth_network: marks tests that require access to the Dartmouth campus network",
    "performance: marks performance benchmark tests",
]

[tool.coverage.run]
source = ["clustrix"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/venv/*",
    "*/.venv/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]