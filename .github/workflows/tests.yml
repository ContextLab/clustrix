name: Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

permissions:
  contents: write
  pull-requests: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
        exclude:
          # Reduce matrix size by excluding some combinations
          - os: windows-latest
            python-version: '3.8'
          - os: macos-latest
            python-version: '3.8'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Cache pytest results
      uses: actions/cache@v4
      with:
        path: .pytest_cache
        key: pytest-cache-${{ matrix.os }}-${{ matrix.python-version }}-${{ hashFiles('tests/**/*.py') }}
        restore-keys: |
          pytest-cache-${{ matrix.os }}-${{ matrix.python-version }}-
          pytest-cache-${{ matrix.os }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test,kubernetes,widget]"
        # Install tomli for pyproject.toml parsing
        pip install tomli

    - name: Infrastructure health check
      run: |
        python scripts/infrastructure_health.py --check --save
      continue-on-error: false

    - name: Test discovery validation
      run: |
        python scripts/test_discovery.py --validate
      continue-on-error: false

    - name: Lint with black
      run: |
        black --check clustrix/ tests/

    - name: Lint with flake8
      run: |
        flake8 clustrix/ tests/ --max-line-length=88 --extend-ignore=E203,W503,F401,E722,F541,F841,F811,E731,E501,W291,W293,F824 --exit-zero

    - name: Performance baseline check
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      run: |
        # Establish baseline on first run or check for regressions
        python scripts/performance_regression.py --check || python scripts/performance_regression.py --baseline
      continue-on-error: true

    - name: Test with pytest
      run: |
        pytest tests/unit/ -v --cov=clustrix --cov-report=xml --cov-report=html --cov-report=term-missing --cov-report=json -m "not real_world" -n 2

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports-${{ matrix.os }}-${{ matrix.python-version }}
        path: |
          coverage.xml
          coverage.json
          htmlcov/
          .coverage
        retention-days: 30

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Coverage diff report
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && github.event_name == 'pull_request'
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        MINIMUM_GREEN: 90
        MINIMUM_ORANGE: 80

    - name: Quality gates enforcement
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      run: |
        python scripts/quality_gates.py --enforce
      continue-on-error: false

    - name: Update coverage badge
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && github.ref == 'refs/heads/master'
      run: |
        python .github/scripts/update_coverage_badge.py
    
    - name: Commit coverage badge update
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && github.ref == 'refs/heads/master'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add README.md
        git diff --staged --quiet || git commit -m "Update coverage badge [skip ci]"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Performance regression check
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      run: |
        python scripts/performance_regression.py --check
      continue-on-error: true

    - name: Upload infrastructure reports
      if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: actions/upload-artifact@v4
      with:
        name: infrastructure-reports
        path: |
          .pytest_cache/infrastructure_health.json
          .pytest_cache/performance_*.json
        retention-days: 30

    - name: Test installation
      run: |
        pip install .
        python -c "import clustrix; print('Clustrix installed successfully')"
        
    - name: Test CLI
      run: |
        clustrix --help
        clustrix config --help

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test,kubernetes,widget]"
        
    - name: Run integration tests
      run: |
        # Run only local integration tests that don't require external resources
        pytest tests/ -k "integration and local and not (gpu or aws or azure or gcp or ssh or slurm or pbs or sge)" -v -x -m "not real_world" || true
        
    - name: Test example scripts
      run: |
        python -c "
        from clustrix import cluster, configure
        configure(cluster_host=None)  # Local execution
        
        @cluster(cores=2)
        def test_example():
            return sum(range(100))
            
        result = test_example()
        assert result == 4950
        print('Example test passed!')
        "

  docs-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[docs]"
        
    - name: Test documentation build
      run: |
        cd docs
        make html
        
    - name: Test notebook execution
      run: |
        pip install jupyter nbconvert
        jupyter nbconvert --to script docs/source/notebooks/basic_usage.ipynb
        # Note: Full notebook execution would require cluster setup