name: Real-World Tests

# Deliberately no `push:` or `pull_request:` trigger. The HuggingFace job uses
# a real token and submits a real job, so a PR from a fork must never be able
# to run it -- GitHub only allows that through `pull_request_target`, which
# this workflow does not use. workflow_dispatch is manual-only and schedule
# only ever runs on the default branch, so both are safe triggers for a
# credentialed job. See issue #113 / #118.
on:
  workflow_dispatch:
  schedule:
    # Weekly, not daily: HF CPU flavors are cheap but not free (#118). Only
    # the hf-jobs-integration job listens to this trigger (see its `if:`
    # below); the local-cluster job is workflow_dispatch-only.
    - cron: '0 3 * * 1'

jobs:
  local-cluster:
    name: Real sshd and SLURM (tests/real_world)
    # Manual-only. This job needs no secret: the cluster it tests against is
    # one it builds itself, in the job's own container.
    #
    # NOT YET RUN ON GITHUB. scripts/setup_local_slurm.sh and the suite were
    # developed and run as root in an Ubuntu 24.04 container, which is what
    # `container:` below asks for; that this job behaves the same on a hosted
    # runner is inferred from reading the script, not observed. The container
    # rather than the runner's own VM is deliberate: the hosted image ships
    # MySQL with a populated /var/lib/mysql, and the script installs MariaDB
    # and skips mariadb-install-db when that directory exists.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 60
    env:
      CLUSTRIX_TEST_SSH_HOST: 127.0.0.1
      CLUSTRIX_TEST_SSH_PORT: "2222"
      CLUSTRIX_TEST_SSH_USER: clx
      CLUSTRIX_TEST_SSH_KEY: /tmp/clustrix-local-cluster/id_ed25519

    steps:
    - name: Install git and Python
      # The container's own Python, not actions/setup-python: a job runs under
      # the cluster's python3, and client and worker must be the same minor
      # version or the submission is refused.
      run: |
        apt-get update -qq
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
          git python3 python3-venv python3-pip

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Let git read the checkout
      # The workspace is owned by the runner's user and this job is root in a
      # container, which git refuses as "dubious ownership". clustrix asks git
      # for the project's top level when it stages input files.
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Stand up sshd and a single-node SLURM cluster
      # Ends by submitting a job with sbatch and requiring it to complete, so
      # a cluster that did not come up fails here rather than in the tests.
      run: bash scripts/setup_local_slurm.sh

    - name: Install clustrix
      run: |
        python3 -m venv /opt/clustrix-venv
        /opt/clustrix-venv/bin/pip install --upgrade pip
        /opt/clustrix-venv/bin/pip install -e ".[dev]"

    - name: Run the real-world suite
      run: |
        /opt/clustrix-venv/bin/python -m pytest tests/real_world/ -m real_world -rs

  # The `secrets` context is not available in `if:` conditions (job-level or
  # step-level) per GitHub's own context-availability rules -- confirmed by
  # actionlint rejecting `secrets.X != ''` there. This job is the standard
  # workaround: resolve secret presence into a step output here, then have
  # the downstream job gate on `needs.check-secrets.outputs.*`, which the
  # `needs` context does allow in `if:`.
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_hf_token: ${{ steps.check.outputs.has_hf_token }}
    steps:
      - name: Check which secrets are configured
        id: check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "has_hf_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_hf_token=false" >> "$GITHUB_OUTPUT"
          fi

  hf-jobs-integration:
    name: HF Jobs Integration Smoke Test
    runs-on: ubuntu-latest
    needs: check-secrets
    timeout-minutes: 10
    # This is the one job in this workflow verified against real
    # infrastructure (issue #118): HuggingFace Jobs under the `contextlab`
    # org namespace. It is the substrate clustrix's integration tests can
    # actually run against, since it needs no cluster reservation, VPN or
    # institutional SSH credentials -- just an org-scoped HF_TOKEN with
    # job.write. Runs on workflow_dispatch and on the weekly schedule above;
    # never on push/pull_request, so a fork PR cannot trigger a billable run.
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && needs.check-secrets.outputs.has_hf_token == 'true' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Submit and execute a real HF Jobs round trip
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        python -c "
        from clustrix import cluster, configure

        # Verified working config (2026-08-17): the personal namespace
        # returns 402 Payment Required (no credits); the org namespace does
        # not. cpu-basic is the cheapest flavor and is pinned explicitly so
        # this can never silently drift onto a billed GPU tier.
        configure(
            cluster_type='huggingface',
            hf_namespace='contextlab',
            hf_flavor='cpu-basic',
            hf_job_timeout='10m',
        )

        @cluster(cores=1)
        def hf_jobs_roundtrip(x, y):
            return x + y

        result = hf_jobs_roundtrip(21, 21)
        assert result == 42, f'Expected 42, got {result}'
        print('HF Jobs integration smoke test passed')
        "
