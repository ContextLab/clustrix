# Docker Compose configuration for local test infrastructure
# This provides real infrastructure for testing without cloud costs

version: '3.8'

# Only services something actually connects to belong here. MinIO,
# PostgreSQL and Redis were started on every `setup` and no test ever
# opened a socket to any of them -- three images pulled, three containers
# run and three volumes kept for nothing (issue #150). Before adding a
# service, have the test that needs it.
services:
  # SSH server for testing SSH-based clusters
  ssh-server:
    build:
      context: .
      dockerfile: Dockerfile.ssh
    container_name: clustrix-test-ssh
    ports:
      - "2222:22"
    volumes:
      - ssh-data:/home/testuser
      - ./test_keys:/home/testuser/.ssh:ro
    environment:
      - SSH_USER=testuser
      - SSH_PASSWORD=testpass
    networks:
      - clustrix-test

  # Mock SLURM controller (simplified)
  slurm-mock:
    build:
      context: .
      dockerfile: Dockerfile.slurm
    container_name: clustrix-test-slurm
    ports:
      - "6817:6817"  # Slurm default port
      - "6818:6818"  # Slurmctld port
    volumes:
      - slurm-data:/var/spool/slurm
    environment:
      - SLURM_CLUSTER_NAME=test-cluster
      - SLURM_CONTROL_MACHINE=slurm-mock
    networks:
      - clustrix-test

volumes:
  ssh-data:
  slurm-data:

networks:
  clustrix-test:
    driver: bridge